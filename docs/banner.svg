<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="PROMPTROOM — Creative and Art Direction Prompt Engine">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f2efe7" stroke-opacity="0.05" />
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111111" />
      <stop offset="0.62" stop-color="#111111" stop-opacity="0.92" />
      <stop offset="1" stop-color="#111111" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4a1c" stop-opacity="0" />
      <stop offset="0.55" stop-color="#ff4a1c" stop-opacity="0.55" />
      <stop offset="1" stop-color="#d8ff4f" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="#111111" />
  <rect width="1280" height="420" fill="url(#grid)" />

  <!-- right artwork -->
  <g opacity="0.9">
    <rect x="880" y="70" width="280" height="280" fill="#171717" stroke="#f2efe7" stroke-opacity="0.12" />
    <rect x="936" y="26" width="208" height="208" fill="#ff4a1c" />
    <rect x="1008" y="152" width="208" height="208" fill="#f2efe7" />
    <rect x="1096" y="88" width="120" height="120" fill="#d8ff4f" />
    <circle cx="956" cy="338" r="46" fill="none" stroke="#f2efe7" stroke-opacity="0.35" stroke-width="2" />
    <path d="M810 348h420" stroke="#f2efe7" stroke-opacity="0.2" />
    <path d="M810 348h420" stroke="url(#flare)" stroke-width="3" />
    <path d="M1200 40v44M1178 62h44" stroke="#ff4a1c" stroke-width="3" />
  </g>
  <rect width="1280" height="420" fill="url(#fade)" />

  <!-- left copy -->
  <g font-family="'Prompt','Inter','Helvetica Neue',Arial,sans-serif">
    <g transform="translate(72 70)">
      <rect width="34" height="34" rx="5" fill="#f2efe7" />
      <rect x="6" y="6" width="10" height="22" fill="#ff4a1c" />
      <rect x="20" y="6" width="8" height="9" fill="#111111" />
      <rect x="20" y="19" width="8" height="9" fill="#7a8b1f" />
    </g>
    <text x="122" y="95" fill="#f2efe7" font-size="15" letter-spacing="6" font-weight="600">TH AI STUDIO</text>

    <text x="72" y="212" fill="#f2efe7" font-size="88" font-weight="600" letter-spacing="-4">PROMPTROOM</text>
    <text x="672" y="170" fill="#ff4a1c" font-size="26" font-weight="500">®</text>

    <text x="74" y="262" fill="#ff4a1c" font-size="26" letter-spacing="2" font-weight="500">CREATIVE &amp; ART DIRECTION PROMPT ENGINE</text>
    <text x="74" y="298" fill="#f2efe7" fill-opacity="0.62" font-size="17" letter-spacing="0.4">BRIEF IN → MASTER PROMPT · CREATIVE ROUTES · SHOT LIST · BRAND KIT</text>

    <g transform="translate(74 330)">
      <rect width="150" height="34" rx="17" fill="none" stroke="#f2efe7" stroke-opacity="0.22" />
      <text x="75" y="22" fill="#d8ff4f" font-size="12" letter-spacing="2" text-anchor="middle">MIDJOURNEY</text>
      <g transform="translate(162 0)">
        <rect width="90" height="34" rx="17" fill="none" stroke="#f2efe7" stroke-opacity="0.22" />
        <text x="45" y="22" fill="#f2efe7" fill-opacity="0.7" font-size="12" letter-spacing="2" text-anchor="middle">FLUX</text>
      </g>
      <g transform="translate(264 0)">
        <rect width="116" height="34" rx="17" fill="none" stroke="#f2efe7" stroke-opacity="0.22" />
        <text x="58" y="22" fill="#f2efe7" fill-opacity="0.7" font-size="12" letter-spacing="2" text-anchor="middle">FIREFLY</text>
      </g>
      <g transform="translate(392 0)">
        <rect width="104" height="34" rx="17" fill="none" stroke="#f2efe7" stroke-opacity="0.22" />
        <text x="52" y="22" fill="#f2efe7" fill-opacity="0.7" font-size="12" letter-spacing="2" text-anchor="middle">RUNWAY</text>
      </g>
    </g>
